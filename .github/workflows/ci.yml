name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -m "not benchmark" -rf --durations=10 --junitxml=test-results.xml
      - name: Verification report
        if: always()
        run: python scripts/verification_report.py test-results.xml verification-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: |
            test-results.xml
            verification-report.md
      - name: Kapı 1 performance (informative on shared runners)
        run: pytest -m benchmark -s
        continue-on-error: true

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -e ".[dev,gui]"
      - name: Native worker, persistence, cancellation and active result exports
        run: pytest -q tests/unit/test_desktop.py tests/unit/test_progress_exports.py tests/unit/test_viewer.py tests/unit/test_cad_geometry.py tests/unit/test_cad_desktop.py tests/unit/test_cad_usability.py tests/unit/test_integrated_modeler.py tests/unit/test_remesh_transfer.py tests/unit/test_workflow_layout.py tests/unit/test_model_editors.py tests/unit/test_phase5_tools.py tests/unit/test_phase5_acceptance.py
