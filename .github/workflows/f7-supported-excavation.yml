name: f7-supported-excavation

on:
  workflow_dispatch:
  push:
    branches:
      - verification/f7-run-real-three-mesh-excavation
  pull_request:
    paths:
      - ".github/workflows/f7-supported-excavation.yml"
      - "examples/f7_excavation_mesh_audit.py"
      - "src/slipsurface/fe2d/post/excavation_coverage.py"
      - "src/slipsurface/fe2d/post/support_coverage_acceptance.py"
      - "src/slipsurface/fe2d/post/support_result_coverage.py"
      - "tests/verification/test_f7_support_result_coverage.py"
      - "tests/verification/test_f7_excavation_inactive_profiles.py"
      - "src/slipsurface/fe2d/post/interface_moment_acceptance.py"
      - "src/slipsurface/fe2d/post/mesh_sensitivity_diagnostics.py"
      - "tests/verification/test_f7_mesh_sensitivity_diagnostics.py"
      - "scripts/f7_evidence_review.py"
      - "tests/verification/test_f7_evidence_review.py"
      - "src/slipsurface/fe2d/post/interface_transfer_ledger.py"
      - "src/slipsurface/fe2d/post/coupled_dry_budget.py"
      - "src/slipsurface/fe2d/post/coupled_seepage_budget.py"
      - "src/slipsurface/fe2d/post/seepage_pressure_evidence.py"
      - "src/slipsurface/fe2d/post/seepage_boundary_evidence.py"
      - "scripts/f7_seepage_boundary_audit.py"
      - "tests/verification/test_f7_seepage_boundary_evidence.py"
      - "src/slipsurface/fe2d/fem/seepage.py"
      - "src/slipsurface/fe2d/fem/static.py"
      - "scripts/f7_seepage_excavation_audit.py"
      - "tests/verification/test_f7_coupled_seepage_budget.py"
      - "src/slipsurface/fe2d/post/dry_applied_loads.py"
      - "src/slipsurface/fe2d/post/incremental_dry_budget.py"
      - "src/slipsurface/fe2d/post/incremental_hydrostatic_budget.py"
      - "scripts/f7_partial_hydrostatic_audit.py"
      - "tests/verification/test_f7_incremental_hydrostatic_budget.py"
      - "src/slipsurface/fe2d/post/coupled_hydrostatic_budget.py"
      - "src/slipsurface/fe2d/post/hydrostatic_nodal_forces.py"
      - "src/slipsurface/fe2d/fem/loads.py"
      - "src/slipsurface/fe2d/fem/pore.py"
      - "scripts/f7_hydrostatic_excavation_audit.py"
      - "tests/verification/test_f7_coupled_hydrostatic_budget.py"
      - "scripts/f7_partial_excavation_audit.py"
      - "tests/verification/test_f7_incremental_dry_budget.py"
      - "scripts/f7_loaded_excavation_audit.py"
      - "tests/verification/test_f7_dry_applied_loads.py"
      - "tests/verification/test_f7_coupled_dry_budget.py"
      - "tests/verification/test_f7_interface_transfer_ledger.py"
      - "src/slipsurface/fe2d/post/interface_ledger_acceptance.py"
      - "tests/verification/test_f7_interface_ledger_acceptance.py"
      - "src/slipsurface/fe2d/post/support_profile_integrity.py"
      - "tests/verification/test_f7_support_profile_integrity.py"
      - "src/slipsurface/fe2d/post/support_field_sensitivity.py"
      - "tests/verification/test_f7_support_field_sensitivity.py"
      - "src/slipsurface/fe2d/post/structural_field_review.py"
      - "tests/verification/test_f7_structural_field_review.py"

permissions:
  contents: read

jobs:
  three-mesh-excavation:
    name: Actual three-mesh pile/anchor excavation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install geometry, FEM and desktop runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
          python -m pip install -r requirements.txt
      - name: Solve staged supported excavation on three independent meshes
        id: run_f7
        shell: bash
        run: |
          set -o pipefail
          mkdir -p f7_audit
          python -u examples/f7_excavation_mesh_audit.py \
            --sizes 2.5 1.8 1.2 \
            --output-dir f7_audit 2>&1 | tee f7_audit/solver.log
      - name: Solve dry loaded excavation with analytical force and moment reference
        run: >-
          python scripts/f7_loaded_excavation_audit.py
          --output f7_audit/loaded_excavation_audit.json
      - name: Solve partial dry excavation and reconstruct retained release forces
        run: >-
          python scripts/f7_partial_excavation_audit.py
          --output f7_audit/partial_excavation_audit.json
      - name: Solve hydrostatic loaded excavation with saturated weights and water forces
        run: >-
          python scripts/f7_hydrostatic_excavation_audit.py
          --output f7_audit/hydrostatic_excavation_audit.json
      - name: Solve partial wet excavation with drawdown and rewetting history
        run: >-
          python scripts/f7_partial_hydrostatic_audit.py
          --output f7_audit/partial_hydrostatic_audit.json
      - name: Solve prescribed-head seepage excavation and verify pressure transfer
        run: >-
          python scripts/f7_seepage_excavation_audit.py
          --output f7_audit/seepage_excavation_audit.json
      - name: Solve infiltration and atmospheric seepage-face excavation
        run: >-
          python scripts/f7_seepage_boundary_audit.py
          --output f7_audit/seepage_boundary_audit.json
      - name: Produce conservative engineering evidence review
        if: always()
        shell: bash
        run: |
          if [ -f f7_audit/excavation_mesh_audit.json ]; then
            python scripts/f7_evidence_review.py f7_audit/excavation_mesh_audit.json
            cat f7_audit/f7_evidence_review.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "F7 evidence report unavailable; see solver log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Summarize actual FEM findings
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("f7_audit/excavation_mesh_audit.json")
          if not path.exists():
              summary = "## F7 three-mesh excavation\n\nNo report was written; inspect solver/job logs.\n"
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              coverage = data.get("mesh_stage_coverage", {})
              support = data.get("support_coverage_acceptance", {})
              interface = data.get("interface_moment_acceptance", {})
              summary = (
                  "## F7 actual three-mesh excavation\n\n"
                  f"- Requested mesh targets: {data.get('mesh_sizes_m')} m\n"
                  f"- Completed stage records: {len(data.get('results', []))}\n"
                  f"- Mesh/stage coverage: {coverage.get('status', 'unknown')}\n"
                  f"- Structural output coverage: {support.get('status', 'unknown')}\n"
                  f"- Active interface moment checks: {interface.get('status', 'unknown')}\n"
                  f"- Interface force-transfer gate: {data.get('interface_transfer_acceptance', {}).get('status', 'unknown')}\n"
                  f"- N/V/M profile integrity: {data.get('support_profile_integrity', {}).get('status', 'unknown')}\n"
                  f"- Full N/V/M field comparisons: {data.get('support_field_sensitivity', {}).get('status', 'unknown')}\n"
                  f"- Relative/absolute N/V/M review: {data.get('structural_field_review', {}).get('status', 'unknown')}\n"
                  f"- Coupled dry balance: {data.get('force_balance_acceptance', {}).get('coupled_dry_balance', {})}\n"
                  f"- Solver/mesh failures: {len(data.get('failures', []))}\n\n"
                  "Numerical sensitivity is not independent physical validation.\n"
              )
          if path.exists():
              failures = data.get("failures", [])
              if failures:
                  summary += "\n### Per-mesh failures\n"
                  for item in failures:
                      summary += (
                          f"- h={item.get('h_m')} m: {item.get('type')}: "
                          f"{item.get('detail')}\n"
                      )
          loaded_path = Path("f7_audit/loaded_excavation_audit.json")
          if loaded_path.exists():
              loaded = json.loads(loaded_path.read_text(encoding="utf-8"))
              summary += (
                  f"\n- Loaded dry excavation: {loaded.get('status', 'unknown')}\n"
                  f"- Loaded stage records: {len(loaded.get('results', []))}\n"
              )
          else:
              summary += "\n- Loaded dry excavation: report unavailable\n"
          partial_path = Path("f7_audit/partial_excavation_audit.json")
          if partial_path.exists():
              partial = json.loads(partial_path.read_text(encoding="utf-8"))
              summary += (
                  f"\n- Partial dry excavation: {partial.get('status', 'unknown')}\n"
                  f"- Partial stage records: {len(partial.get('results', []))}\n"
              )
          else:
              summary += "\n- Partial dry excavation: report unavailable\n"
          water_path = Path("f7_audit/hydrostatic_excavation_audit.json")
          if water_path.exists():
              water = json.loads(water_path.read_text(encoding="utf-8"))
              summary += (
                  f"\n- Hydrostatic excavation: {water.get('status', 'unknown')}\n"
                  f"- Hydrostatic stage records: {len(water.get('results', []))}\n"
              )
          else:
              summary += "\n- Hydrostatic excavation: report unavailable\n"
          wet_history_path = Path("f7_audit/partial_hydrostatic_audit.json")
          if wet_history_path.exists():
              wet_history = json.loads(wet_history_path.read_text(encoding="utf-8"))
              summary += (
                  f"\n- Partial wet excavation: {wet_history.get('status', 'unknown')}\n"
                  f"- Partial wet stage records: {len(wet_history.get('results', []))}\n"
              )
          else:
              summary += "\n- Partial wet excavation: report unavailable\n"
          seepage_path = Path("f7_audit/seepage_excavation_audit.json")
          if seepage_path.exists():
              seepage = json.loads(seepage_path.read_text(encoding="utf-8"))
              summary += (
                  f"\n- Seepage pressure transfer: {seepage.get('status', 'unknown')}\n"
                  f"- Seepage stage records: {len(seepage.get('results', []))}\n"
              )
          else:
              summary += "\n- Seepage pressure transfer: report unavailable\n"
          boundary_path = Path("f7_audit/seepage_boundary_audit.json")
          if boundary_path.exists():
              boundary = json.loads(boundary_path.read_text(encoding="utf-8"))
              summary += (
                  f"\n- Infiltration/seepage face: {boundary.get('status', 'unknown')}\n"
                  f"- Infiltration stage records: {len(boundary.get('results', []))}\n"
              )
          else:
              summary += "\n- Infiltration/seepage face: report unavailable\n"
          Path("f7-summary.md").write_text(summary, encoding="utf-8")
          print(summary)
          PY
          cat f7-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complete and partial verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f7-three-mesh-excavation-evidence
          path: |
            f7_audit/
            f7-summary.md
          if-no-files-found: warn
          retention-days: 30
