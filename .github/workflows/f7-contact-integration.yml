name: f7-contact-integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/f7-contact-integration.yml'

permissions:
  contents: read

jobs:
  source-baseline:
    name: Reproducible integration baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Archive tracked source without credentials or Git metadata
        run: |
          mkdir -p integration-baseline
          git archive --format=tar HEAD -o integration-baseline/source.tar
          git rev-parse HEAD > integration-baseline/source-commit.txt
          python -m pip download --only-binary=:all: --no-deps ruff -d integration-baseline/
      - name: Preserve reproducible development baseline
        uses: actions/upload-artifact@v4
        with:
          name: f7-contact-integration-source-baseline
          path: integration-baseline/
          retention-days: 7
          if-no-files-found: error
