name: f7-contact-integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/f7-contact-integration.yml'
      - 'src/slipsurface/fe2d/fem/**'
      - 'src/slipsurface/fe2d/model/**'
      - 'src/slipsurface/fe2d/io/**'
      - 'scripts/f7_contact_static_benchmark.py'
      - 'scripts/f7_contact_equilibrium_benchmark.py'
      - 'src/slipsurface/fe2d/post/contact_equilibrium.py'
      - 'src/slipsurface/fe2d/post/contact_results.py'
      - 'src/slipsurface/fe2d/post/contact_resultants.py'
      - 'src/slipsurface/fe2d/post/dry_applied_loads.py'
      - 'tests/verification/test_f7_contact_equilibrium.py'
      - 'src/slipsurface/fe2d/post/contact_partial_equilibrium.py'
      - 'scripts/f7_contact_partial_benchmark.py'
      - 'tests/verification/test_f7_contact_partial_equilibrium.py'
      - 'src/slipsurface/fe2d/post/contact_activation_equilibrium.py'
      - 'scripts/f7_contact_activation_benchmark.py'
      - 'tests/verification/test_f7_contact_activation_equilibrium.py'
      - 'tests/verification/test_f7_contact_static_integration.py'
      - 'requirements-core.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/f7-contact-integration.yml'
      - 'src/slipsurface/fe2d/fem/**'
      - 'src/slipsurface/fe2d/model/**'
      - 'src/slipsurface/fe2d/io/**'
      - 'scripts/f7_contact_static_benchmark.py'
      - 'scripts/f7_contact_equilibrium_benchmark.py'
      - 'src/slipsurface/fe2d/post/contact_equilibrium.py'
      - 'src/slipsurface/fe2d/post/contact_results.py'
      - 'src/slipsurface/fe2d/post/contact_resultants.py'
      - 'src/slipsurface/fe2d/post/dry_applied_loads.py'
      - 'tests/verification/test_f7_contact_equilibrium.py'
      - 'src/slipsurface/fe2d/post/contact_partial_equilibrium.py'
      - 'scripts/f7_contact_partial_benchmark.py'
      - 'tests/verification/test_f7_contact_partial_equilibrium.py'
      - 'src/slipsurface/fe2d/post/contact_activation_equilibrium.py'
      - 'scripts/f7_contact_activation_benchmark.py'
      - 'tests/verification/test_f7_contact_activation_equilibrium.py'
      - 'tests/verification/test_f7_contact_static_integration.py'
      - 'requirements-core.txt'

permissions:
  contents: read

jobs:
  native-integration:
    name: Native staged contact and continuum
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install core validation dependencies
        run: python -m pip install -r requirements-core.txt pytest ruff
      - name: Lint application and contact benchmark
        run: >-
          ruff check src tests scripts/f7_contact_static_benchmark.py
          scripts/f7_contact_equilibrium_benchmark.py scripts/f7_contact_partial_benchmark.py
          scripts/f7_contact_activation_benchmark.py
      - name: Verify native state, contact kernel and serialization contracts
        run: >-
          python -m pytest -q tests/verification/test_f7_contact_static_integration.py
          tests/verification/test_f7_unilateral_contact.py
          tests/verification/test_f7_contact_equilibrium.py
          tests/verification/test_f7_contact_partial_equilibrium.py
          tests/verification/test_f7_contact_activation_equilibrium.py
          --junitxml=contact-integration-tests.xml
      - name: Solve native continuum-contact load histories against closed form
        shell: bash
        run: |
          mkdir -p f7_contact_integration
          python -u scripts/f7_contact_static_benchmark.py \
            --output f7_contact_integration/native_contact.json \
            2>&1 | tee f7_contact_integration/solver.log
      - name: Audit independent nodal and external contact force and moment budgets
        shell: bash
        run: |
          set -o pipefail
          python -u scripts/f7_contact_equilibrium_benchmark.py \
            --output f7_contact_integration/contact_equilibrium.json \
            2>&1 | tee f7_contact_integration/equilibrium.log
      - name: Verify fixed-topology partial load histories independently
        shell: bash
        run: |
          set -o pipefail
          python -u scripts/f7_contact_partial_benchmark.py \
            --output f7_contact_integration/contact_partial_equilibrium.json \
            2>&1 | tee f7_contact_integration/partial-equilibrium.log
      - name: Verify partial contact activation and independently retained release
        shell: bash
        run: |
          set -o pipefail
          python -u scripts/f7_contact_activation_benchmark.py \
            --output f7_contact_integration/contact_activation_equilibrium.json \
            2>&1 | tee f7_contact_integration/activation-equilibrium.log
      - name: Require complete unskipped numerical evidence
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          tests = ET.parse('contact-integration-tests.xml').getroot()
          assert list(tests.iter('testcase')), 'No test evidence'
          for label in ('skipped', 'failure', 'error'):
              assert not list(tests.iter(label)), label
          data = json.loads(Path('f7_contact_integration/contact_equilibrium.json').read_text())
          assert data['status'] == 'passed'
          assert data['case_count'] == 16 and data['stage_count'] == 104
          assert all(c['status'] == 'passed' and c['stages'] for c in data['cases'])
          assert all(s['status'] == 'passed' for c in data['cases'] for s in c['stages'])
          partial = json.loads(Path('f7_contact_integration/contact_partial_equilibrium.json').read_text())
          assert partial['status'] == 'passed'
          assert partial['case_count'] == 20 and partial['stage_count'] == 132
          assert all(c['status'] == 'passed' and c['initial_status'] == 'passed'
                     for c in partial['cases'])
          assert all(s['status'] == 'passed' for c in partial['cases'] for s in c['stages'])
          assert all(r['status'] == 'passed' for c in partial['cases']
                     for r in c.get('analytical_layer_checks', c.get('analytical_applied_checks', [])))
          assert sum(len(c.get('analytical_layer_checks', c.get('analytical_applied_checks', [])))
                     for c in partial['cases']) == 132
          activation = json.loads(Path(
              'f7_contact_integration/contact_activation_equilibrium.json').read_text())
          assert activation['status'] == 'passed'
          assert activation['case_count'] == 32 and activation['stage_count'] == 288
          assert all(c['status'] == 'passed' and c['initial_status'] == 'passed'
                     and c['stage_count'] == 9 for c in activation['cases'])
          assert all(s['status'] == 'passed' for c in activation['cases'] for s in c['stages'])
          assert sum(len(c['independent_reference_checks']) for c in activation['cases']) == 288
          assert all(r['status'] == 'passed' for c in activation['cases']
                     for r in c['independent_reference_checks'])
          assert any(max(abs(v) for node in s['history']['retained_release_nodal'] for v in node)
                     > 1.0 for c in activation['cases'] for s in c['stages'])
          PY
      - name: Summarize actual integration evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('f7_contact_integration/native_contact.json')
          lines = ['## Native staged normal contact', '']
          if path.exists():
              data = json.loads(path.read_text(encoding='utf-8'))
              lines += [f"- Status: {data['status']}",
                        f"- Native solver: {data['native_solver']}",
                        f"- Models/stages: {data['case_count']}/{data['stage_count']}"]
          else:
              lines += ['No completed benchmark evidence; inspect prior failure logs.']
          equilibrium_path = Path('f7_contact_integration/contact_equilibrium.json')
          if equilibrium_path.exists():
              audit = json.loads(equilibrium_path.read_text(encoding='utf-8'))
              lines += [f"- Contact nodal/external equilibrium: {audit['status']}",
                        f"- Equilibrium models/stages: {audit['case_count']}/{audit['stage_count']}"]
          else:
              lines += ['- Contact equilibrium: no evidence; not a pass.']
          partial_path = Path('f7_contact_integration/contact_partial_equilibrium.json')
          if partial_path.exists():
              partial = json.loads(partial_path.read_text(encoding='utf-8'))
              lines += [f"- Partial contact equilibrium: {partial['status']}",
                        f"- Partial models/stages: {partial['case_count']}/{partial['stage_count']}"]
          else:
              lines += ['- Partial contact equilibrium: no evidence; not a pass.']
          activation_path = Path('f7_contact_integration/contact_activation_equilibrium.json')
          if activation_path.exists():
              activation = json.loads(activation_path.read_text(encoding='utf-8'))
              lines += [f"- Partial contact activation/release: {activation['status']}",
                        f"- Activation models/stages: {activation['case_count']}/{activation['stage_count']}"]
          else:
              lines += ['- Partial contact activation/release: no evidence; not a pass.']
          lines += ['', 'Explicit dry normal-contact option; legacy Goodman is unchanged.',
                    'Initial stress none and NR only. No hydraulic/SRF/GUI authoring claim.',
                    'Result snapshots are not nonlinear solver restart checkpoints.', '']
          summary = '\n'.join(lines)
          Path('contact-integration-summary.md').write_text(summary, encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(summary)
          PY
      - name: Preserve actual or partial integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f7-native-contact-integration-evidence
          path: |
            f7_contact_integration/
            contact-integration-tests.xml
            contact-integration-summary.md
          retention-days: 30
          if-no-files-found: warn
