name: plaxis-drain-benchmark

on:
  pull_request:
  push:
    branches: [main]

jobs:
  plaxis-drain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install numerical dependencies
        run: python -m pip install -r requirements-core.txt
      - name: Run PLAXIS Drain verification
        run: |
          mkdir -p external-benchmarks
          python scripts/plaxis_drain_benchmark.py \
            --require-pass \
            --json external-benchmarks/plaxis-drain.json \
            --markdown external-benchmarks/plaxis-drain.md
          cat external-benchmarks/plaxis-drain.md
      - name: Archive benchmark characterization
        uses: actions/upload-artifact@v4
        with:
          name: external-benchmark-plaxis-drain
          path: external-benchmarks/
          if-no-files-found: error
