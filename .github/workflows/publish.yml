name: package-check-publishing-paused

on:
  workflow_dispatch:

# Publishing withdrawn after user usability review (2026-10-22).
# This workflow only builds/checks packages. Restore publishing only after acceptance.

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python scripts/check_distributions.py dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: publish-distributions
          path: dist/*
