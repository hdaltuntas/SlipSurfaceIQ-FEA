name: b5-bond-slip

on:
  pull_request:
  push:
    branches: [main]

jobs:
  constitutive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install numerical dependencies
        run: python -m pip install -r requirements-core.txt pytest
      - name: Run B5 bond-slip verification
        run: pytest -q tests/verification/test_b5_bond_slip.py
      - name: Run strict constitutive benchmark
        run: |
          mkdir -p b5-bond-slip
          python scripts/b5_bond_slip_benchmark.py \\
            --require-pass \\
            --json b5-bond-slip/report.json \\
            --markdown b5-bond-slip/report.md
          cat b5-bond-slip/report.md
      - name: Archive benchmark characterization
        uses: actions/upload-artifact@v4
        with:
          name: b5-bond-slip-characterization
          path: b5-bond-slip/
          if-no-files-found: error
