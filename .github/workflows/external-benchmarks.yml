name: external-benchmarks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rs2-introduction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install numerical dependencies
        run: python -m pip install -r requirements-core.txt
      - name: Run RS2 Introduction reproduction
        run: |
          mkdir -p external-benchmarks
          python scripts/rs2_introduction_benchmark.py             --json external-benchmarks/rs2-introduction.json             --markdown external-benchmarks/rs2-introduction.md
          cat external-benchmarks/rs2-introduction.md
      - name: Archive benchmark characterization
        uses: actions/upload-artifact@v4
        with:
          name: external-benchmark-rs2-introduction
          path: external-benchmarks/
          if-no-files-found: error
