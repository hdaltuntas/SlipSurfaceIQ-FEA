name: b5-embedded-bond

on:
  pull_request:
  push:
    branches: [main]

jobs:
  embedded-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install numerical dependencies
        run: python -m pip install -r requirements-core.txt pytest ruff
      - name: Lint embedded-bond sources and tests
        run: |
          ruff check src tests/verification/test_b5_embedded_bond.py scripts/b5_embedded_bond_benchmark.py
      - name: Run embedded bond verification
        run: pytest -q tests/verification/test_b5_embedded_bond.py
      - name: Run strict shear-lag characterization
        run: |
          mkdir -p b5-embedded-bond
          python scripts/b5_embedded_bond_benchmark.py \
            --require-pass \
            --json b5-embedded-bond/report.json \
            --markdown b5-embedded-bond/report.md
          cat b5-embedded-bond/report.md
      - name: Archive benchmark characterization
        uses: actions/upload-artifact@v4
        with:
          name: b5-embedded-bond-characterization
          path: b5-embedded-bond/
          if-no-files-found: error
